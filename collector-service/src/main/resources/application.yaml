spring:
  application:
    name: collector-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  collector:
    scheduler:
      news:
        enabled: true
        fixed-delay: 10m
        initial-delay: 30s
    clients:
      user-service:
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
    providers:
      google:
        enabled: true
        base-url: https://news.google.com
        rss-search-path: /rss/search
        language-code: ko
        country-code: KR
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
      naver:
        enabled: false
        base-url: https://openapi.naver.com
        news-search-path: /v1/search/news.json
        client-id: ""
        client-secret: ""
        display: 100
        start: 1
        sort: date
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
      finnhub:
        enabled: false
        base-url: https://finnhub.io
        company-news-path: /api/v1/company-news
        api-key: ""
        lookback-days: 7
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
