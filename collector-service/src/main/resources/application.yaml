spring:
  application:
    name: collector-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  collector:
    outbox:
      relay:
        enabled: true
        publisher-id: ${HOSTNAME:collector-service-${random.uuid}}
        fixed-delay: 5s
        initial-delay: 15s
        batch-size: 50
        publishing-visibility-timeout: 60s
        retry:
          max-attempts: 5
          base-delay: 1s
          max-delay: 1m
          multiplier: 2.0
    events:
      enabled: true
      topics:
        news-collected: collector.news.collected
      # 기사 id compaction과 함께 걸리는 삭제 기간
      retention: 30d
    scheduler:
      news:
        enabled: true
        fixed-delay: 10m
        initial-delay: 30s
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:}
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
    providers:
      google:
        enabled: true
        base-url: https://news.google.com
        rss-search-path: /rss/search
        language-code: ko
        country-code: KR
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
      naver:
        enabled: true
        base-url: https://openapi.naver.com
        news-search-path: /v1/search/news.json
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
        display: 100
        start: 1
        sort: date
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
      finnhub:
        enabled: true
        base-url: https://finnhub.io
        company-news-path: /api/v1/company-news
        api-key: ${FINNHUB_API_KEY:}
        lookback-days: 7
        connect-timeout: 2s
        response-timeout: 5s
        read-timeout: 5s
        write-timeout: 5s
        max-in-memory-size: 524288
