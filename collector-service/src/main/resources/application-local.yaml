spring:
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:kachi_collector}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true

kachi:
  collector:
    scheduler:
      news:
        enabled: ${KACHI_COLLECTOR_NEWS_SCHEDULER_ENABLED:true}
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8080}
