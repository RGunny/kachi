spring:
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:kachi_collector}
    representation:
      uuid: standard

kachi:
  collector:
    scheduler:
      news:
        enabled: ${KACHI_COLLECTOR_NEWS_SCHEDULER_ENABLED:false}
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8081}
