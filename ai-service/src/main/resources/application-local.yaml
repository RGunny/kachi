spring:
  mongodb:
    uri: mongodb://localhost:27017/kachi_ai?replicaSet=rs0
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: false
      keyword-expansion:
        enabled: false
    outbox:
      relay:
        enabled: false
    events:
      enabled: false
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8080}
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:http://localhost:8082}
    providers:
      mode: single-random
      openrouter:
        enabled: true
      groq:
        enabled: true
      together:
        enabled: true
      cerebras:
        enabled: true
      mistral:
        enabled: true
      gemini:
        enabled: false
