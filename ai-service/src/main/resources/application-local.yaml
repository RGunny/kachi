spring:
  mongodb:
    uri: mongodb://localhost:27017/kachi_ai?replicaSet=rs0
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: false
      keyword-expansion:
        enabled: false
    outbox:
      relay:
        enabled: false
    events:
      enabled: false
    clients:
      user-service:
        base-url: http://localhost:8080
      collector-service:
        base-url: http://localhost:8082
    providers:
      mode: single-random
      openrouter:
        enabled: true
        api-key: ${OPENROUTER_API_KEY}
      groq:
        enabled: true
        api-key: ${GROQ_API_KEY}
      together:
        enabled: true
        api-key: ${TOGETHER_API_KEY}
      cerebras:
        enabled: true
        api-key: ${CEREBRAS_API_KEY}
      mistral:
        enabled: true
        api-key: ${MISTRAL_API_KEY}
      gemini:
        enabled: false
