spring:
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:kachi_ai}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: ${KACHI_AI_NEWS_SUMMARY_SCHEDULER_ENABLED:false}
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8080}
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:http://localhost:8082}
    providers:
      mode: ${KACHI_AI_LLM_PROVIDER_MODE:single-random}
      openrouter:
        enabled: ${KACHI_AI_OPENROUTER_ENABLED:true}
      groq:
        enabled: ${KACHI_AI_GROQ_ENABLED:true}
      together:
        enabled: ${KACHI_AI_TOGETHER_ENABLED:true}
      cerebras:
        enabled: ${KACHI_AI_CEREBRAS_ENABLED:true}
      mistral:
        enabled: ${KACHI_AI_MISTRAL_ENABLED:true}
      gemini:
        enabled: ${KACHI_AI_GEMINI_ENABLED:false}
