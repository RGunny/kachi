spring:
  mongodb:
    uri: mongodb://localhost:27017/kachi_ai?replicaSet=rs0
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: true
      keyword-expansion:
        enabled: true
    outbox:
      relay:
        enabled: true
    events:
      enabled: true
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8080}
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:http://localhost:8082}
    llm:
      uses:
        NEWS_SUMMARY:
          candidates: [OLLAMA_QWEN3_27B]
        KEYWORD_EXPANSION:
          candidates: [OLLAMA_QWEN3_27B]
