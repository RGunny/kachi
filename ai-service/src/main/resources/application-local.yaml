spring:
  mongodb:
    uri: mongodb://localhost:27017/kachi_ai?replicaSet=rs0
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        # 로컬 Ollama의 요약 한 건이 분 단위라 한 poll의 처리 시간이 길다
        max.poll.interval.ms: 600000

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: true
      keyword-expansion:
        enabled: true
      story-summary:
        enabled: true
    consumer:
      # arm64 CPU 추론에서 즉시 트리거의 LLM 호출이 poll 하나를 오래 잡는다
      max-poll-records: 1
    outbox:
      relay:
        enabled: true
    events:
      enabled: true
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:http://localhost:8080}
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:http://localhost:8082}
    llm:
      uses:
        NEWS_SUMMARY:
          candidates: [OLLAMA_QWEN3_27B]
        STORY_SUMMARY:
          candidates: [OLLAMA_QWEN3_27B]
        KEYWORD_EXPANSION:
          candidates: [OLLAMA_QWEN3_27B]
