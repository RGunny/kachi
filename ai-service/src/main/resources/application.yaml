spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: true
        fixed-delay: 10m
        initial-delay: 30s
        overlap: 5m
        max-lookback: 6h
        max-articles-per-keyword: 20
      keyword-expansion:
        enabled: false
        fixed-delay: 24h
        initial-delay: 5m
        max-expansions-per-keyword: 5
    quarantine:
      failure-threshold: 3
    clients:
      user-service:
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
      collector-service:
        news-path: /api/v1/internal/news
        timeout: 3s
        max-in-memory-size: 262144
    providers:
      mode: single-random
      keyword-expansion-prompt-version: keyword-expansion-v1
      news-summary-prompt-version: news-summary-v1
      openrouter:
        enabled: false
        api-key: ""
        base-url: https://openrouter.ai/api/v1
        chat-completions-path: /chat/completions
        model: openai/gpt-4o-mini
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      groq:
        enabled: false
        api-key: ""
        base-url: https://api.groq.com/openai/v1
        chat-completions-path: /chat/completions
        model: llama-3.3-70b-versatile
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      together:
        enabled: false
        api-key: ""
        base-url: https://api.together.xyz/v1
        chat-completions-path: /chat/completions
        model: meta-llama/Llama-3.3-70B-Instruct-Turbo
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      cerebras:
        enabled: false
        api-key: ""
        base-url: https://api.cerebras.ai/v1
        chat-completions-path: /chat/completions
        model: gpt-oss-120b
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      mistral:
        enabled: false
        api-key: ""
        base-url: https://api.mistral.ai/v1
        chat-completions-path: /chat/completions
        model: mistral-small-latest
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      gemini:
        enabled: false
        api-key: ""
        base-url: https://generativelanguage.googleapis.com
        generate-content-path: /v1beta/models/{model}:generateContent
        model: gemini-2.0-flash
      circuit-breaker:
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      failover:
        default-cooldown: 60s
        max-cooldown: 10m
