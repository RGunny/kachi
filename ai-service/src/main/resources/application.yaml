spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        # relay의 publishing-visibility-timeout(60s)에서 역산한 값이다. max.block + delivery = 15s < 60s.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: true
        fixed-delay: 10m
        initial-delay: 30s
        overlap: 5m
        max-lookback: 6h
        max-articles-per-keyword: 20
      keyword-expansion:
        enabled: false
        fixed-delay: 24h
        initial-delay: 5m
        max-expansions-per-keyword: 5
    quarantine:
      failure-threshold: 3
    outbox:
      relay:
        enabled: true
        publisher-id: ${HOSTNAME:ai-service-${random.uuid}}
        fixed-delay: 5s
        initial-delay: 15s
        batch-size: 50
        publishing-visibility-timeout: 60s
        retry:
          max-attempts: 5
          base-delay: 1s
          max-delay: 1m
          multiplier: 2.0
    events:
      enabled: true
      topics:
        summary-created: ai.summary.created
        keyword-quarantined: ai.keyword.quarantined
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:}
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:}
        news-path: /api/v1/internal/news
        timeout: 3s
        max-in-memory-size: 262144
    llm:
      providers:
        GROQ:
          base-url: https://api.groq.com/openai/v1
          api-key: ${GROQ_API_KEY:}
          billing: free-tier
          connect-timeout: 2s
        MISTRAL:
          base-url: https://api.mistral.ai/v1
          api-key: ${MISTRAL_API_KEY:}
          billing: free-tier
          connect-timeout: 2s
        # 같은 머신의 Ollama. 인증이 없어 api-key도 없다.
        OLLAMA:
          base-url: http://localhost:11434/v1
          billing: self-hosted
          connect-timeout: 2s
      # 시간은 모델의 속성이다. 같은 모델도 호스팅에 따라 수십 배 다르다. slow-after는 timeout보다 짧아야 한다.
      models:
        GROQ_QWEN3_27B: { timeout: 10s, slow-after: 8s }
        MISTRAL_SMALL_2603: { timeout: 10s, slow-after: 8s }
        OLLAMA_QWEN3_27B: { timeout: 150s, slow-after: 120s }
      # 용도마다 시도할 모델의 순서. 여기 없는 모델은 클라이언트도 서킷도 만들지 않는다.
      uses:
        NEWS_SUMMARY:
          candidates: [GROQ_QWEN3_27B, MISTRAL_SMALL_2603]
        KEYWORD_EXPANSION:
          candidates: [GROQ_QWEN3_27B, MISTRAL_SMALL_2603]
      guard:
        # failure rate·slow call rate·wait duration은 모델 전체가 공유한다. slow call duration threshold는 models.*.slow-after다.
        circuit-breaker:
          sliding-window-size: 6
          minimum-number-of-calls: 3
          failure-rate-threshold: 50
          slow-call-rate-threshold: 80
          wait-duration-in-open-state: 60s
          permitted-number-of-calls-in-half-open-state: 2
        # 429를 받은 모델이 대기 시간. Retry-After가 있으면 그 값(상한 max), 없으면 default.
        cooldown:
          default: 60s
          max: 10m
        # 404·401·402·403을 받은 모델이나 제공자를 후보에서 빼는 시간. 지나면 한 번 다시 시도하고 같은 실패면 다시 뺀다.
        hold:
          reprobe-after: 1h
