spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mongodb:
    uri: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}
    representation:
      uuid: standard

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: ${KACHI_AI_NEWS_SUMMARY_SCHEDULER_ENABLED:true}
        fixed-delay: ${KACHI_AI_NEWS_SUMMARY_SCHEDULER_FIXED_DELAY:10m}
        initial-delay: ${KACHI_AI_NEWS_SUMMARY_SCHEDULER_INITIAL_DELAY:30s}
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL}
        active-keywords-path: ${KACHI_USER_SERVICE_ACTIVE_KEYWORDS_PATH:/api/v1/internal/keywords/active}
        timeout: ${KACHI_USER_SERVICE_TIMEOUT:3s}
        max-in-memory-size: ${KACHI_USER_SERVICE_MAX_IN_MEMORY_SIZE:262144}
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL}
        news-path: ${KACHI_COLLECTOR_SERVICE_NEWS_PATH:/api/v1/internal/news}
        timeout: ${KACHI_COLLECTOR_SERVICE_TIMEOUT:3s}
        max-in-memory-size: ${KACHI_COLLECTOR_SERVICE_MAX_IN_MEMORY_SIZE:262144}
