spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    representation:
      uuid: standard
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        # relay의 publishing-visibility-timeout(60s)에서 역산한 값이다. max.block + delivery = 15s < 60s.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: true
        fixed-delay: 10m
        initial-delay: 30s
        overlap: 5m
        max-lookback: 6h
        max-articles-per-keyword: 20
      keyword-expansion:
        enabled: false
        fixed-delay: 24h
        initial-delay: 5m
        max-expansions-per-keyword: 5
    quarantine:
      failure-threshold: 3
    outbox:
      relay:
        enabled: true
        publisher-id: ${HOSTNAME:ai-service-${random.uuid}}
        fixed-delay: 5s
        initial-delay: 15s
        batch-size: 50
        publishing-visibility-timeout: 60s
        retry:
          max-attempts: 5
          base-delay: 1s
          max-delay: 1m
          multiplier: 2.0
    events:
      enabled: true
      topics:
        summary-created: ai.summary.created
        keyword-quarantined: ai.keyword.quarantined
    clients:
      user-service:
        base-url: ${KACHI_USER_SERVICE_BASE_URL:}
        active-keywords-path: /api/v1/internal/keywords/active
        timeout: 3s
        max-in-memory-size: 262144
      collector-service:
        base-url: ${KACHI_COLLECTOR_SERVICE_BASE_URL:}
        news-path: /api/v1/internal/news
        timeout: 3s
        max-in-memory-size: 262144
    providers:
      mode: single-random
      keyword-expansion-prompt-version: keyword-expansion-v1
      news-summary-prompt-version: news-summary-v1
      openrouter:
        enabled: false
        api-key: ${OPENROUTER_API_KEY:}
        base-url: https://openrouter.ai/api/v1
        chat-completions-path: /chat/completions
        model: openai/gpt-4o-mini
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      groq:
        enabled: false
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
        chat-completions-path: /chat/completions
        model: llama-3.3-70b-versatile
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      together:
        enabled: false
        api-key: ${TOGETHER_API_KEY:}
        base-url: https://api.together.xyz/v1
        chat-completions-path: /chat/completions
        model: meta-llama/Llama-3.3-70B-Instruct-Turbo
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      cerebras:
        enabled: false
        api-key: ${CEREBRAS_API_KEY:}
        base-url: https://api.cerebras.ai/v1
        chat-completions-path: /chat/completions
        model: gpt-oss-120b
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      mistral:
        enabled: false
        api-key: ${MISTRAL_API_KEY:}
        base-url: https://api.mistral.ai/v1
        chat-completions-path: /chat/completions
        model: mistral-small-latest
        connect-timeout: 2s
        response-timeout: 10s
        read-timeout: 10s
        write-timeout: 10s
        max-in-memory-size: 524288
      # 같은 머신의 Ollama. 인증이 없어 api-key는 자리표시 값이고, 로컬 모델은 응답이 수십 초라 timeout을 길게 둔다.
      # 서킷 브레이커의 slow-call 판정(8s)은 전역 설정이라 local llm 과 분류체계가 필요할 지 이후 재설계한다.
      ollama:
        enabled: false
        api-key: ollama
        base-url: http://localhost:11434/v1
        chat-completions-path: /chat/completions
        model: qwen3.8:27b
        reasoning-effort: none
        connect-timeout: 2s
        response-timeout: 180s
        read-timeout: 180s
        write-timeout: 10s
        max-in-memory-size: 524288
      gemini:
        enabled: false
        api-key: ${GEMINI_API_KEY:}
        base-url: https://generativelanguage.googleapis.com
        generate-content-path: /v1beta/models/{model}:generateContent
        model: gemini-2.0-flash
      circuit-breaker:
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      failover:
        default-cooldown: 60s
        max-cooldown: 10m
