spring:
  mongodb:
    uri: mongodb://localhost:27017/kachi_ai_test
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true

kachi:
  ai:
    scheduler:
      news-summary:
        enabled: false
    clients:
      user-service:
        base-url: http://localhost:8080
      collector-service:
        base-url: http://localhost:8082
    providers:
      active-provider: openrouter
      openrouter:
        enabled: true
      groq:
        enabled: true
      together:
        enabled: true
      cerebras:
        enabled: true
      mistral:
        enabled: true
      gemini:
        enabled: true
