# push와 PR마다 ubuntu 러너에서 `./gradlew test`를 실행한다. Testcontainers는 러너에 설치된 Docker를 사용한다. e2eTest와 realTest는 실행하지 않는다.
name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  TZ: Asia/Seoul
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --continue
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
