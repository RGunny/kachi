spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

kachi:
  jwt:
    secret: ${KACHI_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
