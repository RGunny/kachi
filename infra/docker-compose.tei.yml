services:
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-arm64-sha-4150561}
    container_name: kachi-tei-embedding
    # revision은 Hugging Face 커밋이다. 가중치를 바꾸는 것은 모델을 바꾸는 것이라 env로 열지 않는다.
    command:
      - --model-id=BAAI/bge-m3
      - --revision=5617a9f61b028005a4858fdac845db406aefb181
      - --pooling=cls
      - --huggingface-hub-cache=/data
      - --max-client-batch-size=32
      # max-batch-tokens는 한 배치의 토큰 총량이면서 입력 한 건의 상한이기도 하다.
      # 기동 워밍업이 이 값만큼의 시퀀스를 한 번 계산하므로 값이 곧 메모리 상한이다.
      - --max-batch-tokens=512
      - --max-concurrent-requests=32
    ports:
      - "${TEI_EMBEDDING_PORT:-8090}:80"
    volumes:
      - tei-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-arm64-sha-4150561}
    container_name: kachi-tei-reranker
    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --revision=953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --huggingface-hub-cache=/data
      - --max-client-batch-size=32
      - --max-batch-tokens=512
      - --max-concurrent-requests=32
      # 이 가중치에는 ONNX가 없어 candle 백엔드로 뜬다. float32는 6.1GB를 쓴다.
      - --dtype=float16
    ports:
      - "${TEI_RERANKER_PORT:-8091}:80"
    volumes:
      - tei-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
