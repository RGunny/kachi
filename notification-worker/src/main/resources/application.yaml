spring:
  application:
    name: notification-worker
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mongodb:
    uri: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}
    representation:
      uuid: standard
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${KACHI_NOTIFICATION_WORKER_GROUP_ID:notification-worker}
      auto-offset-reset: ${KACHI_NOTIFICATION_WORKER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  notification:
    worker:
      worker-id: ${KACHI_NOTIFICATION_WORKER_ID:notification-worker-local}
      dispatch:
        topic: ${KACHI_NOTIFICATION_DISPATCH_TOPIC:notification.dispatch}
        group-id: ${KACHI_NOTIFICATION_WORKER_GROUP_ID:notification-worker}
        dedupe-ttl: ${KACHI_NOTIFICATION_DISPATCH_DEDUPE_TTL:PT5M}
        idempotency-key-ttl: ${KACHI_NOTIFICATION_VENDOR_IDEMPOTENCY_KEY_TTL:PT24H}
        retry:
          max-attempts: ${KACHI_NOTIFICATION_DISPATCH_RETRY_MAX_ATTEMPTS:3}
          backoff: ${KACHI_NOTIFICATION_DISPATCH_RETRY_BACKOFF:PT1S}
        dlt:
          topic: ${KACHI_NOTIFICATION_DISPATCH_DLT_TOPIC:notification.dispatch.dlt}
      sender:
        mock:
          enabled: true
          channels: SLACK,DISCORD,TELEGRAM,SMS,KAKAO,EMAIL
          mode: SUCCESS
        slack:
          enabled: true
          webhook-url: ${KACHI_NOTIFICATION_SLACK_WEBHOOK_URL:}
          timeout: PT3S
