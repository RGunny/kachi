spring:
  application:
    name: notification-worker
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mongodb:
    uri: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}
    representation:
      uuid: standard
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KACHI_NOTIFICATION_WORKER_GROUP_ID:notification-worker}
      auto-offset-reset: ${KACHI_NOTIFICATION_WORKER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
    listener:
      ack-mode: manual

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health