spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    mongodb:
      auto-index-creation: false
  mongodb:
    uri: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}
    representation:
      uuid: standard
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
        properties:
          enable.idempotence: true
          acks: all

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

kachi:
  notification:
    request:
      topic: ${KACHI_NOTIFICATION_REQUEST_TOPIC:notification.requested}
      group-id: ${KACHI_NOTIFICATION_REQUEST_GROUP_ID:notification-service}
      dedupe-ttl: ${KACHI_NOTIFICATION_REQUEST_DEDUPE_TTL:PT24H}
      dlt:
        topic: ${KACHI_NOTIFICATION_REQUEST_DLT_TOPIC:notification.requested.dlt}
      retry:
        max-attempts: ${KACHI_NOTIFICATION_REQUEST_RETRY_MAX_ATTEMPTS:3}
        backoff: ${KACHI_NOTIFICATION_REQUEST_RETRY_BACKOFF:PT1S}
    dispatch:
      topic: ${KACHI_NOTIFICATION_DISPATCH_TOPIC:notification.dispatch}
    outbox:
      publisher-id: ${KACHI_NOTIFICATION_OUTBOX_PUBLISHER_ID:notification-service-local}
      batch-size: ${KACHI_NOTIFICATION_OUTBOX_BATCH_SIZE:100}
      poll-interval: ${KACHI_NOTIFICATION_OUTBOX_POLL_INTERVAL:PT1S}
      publishing-visibility-timeout: ${KACHI_NOTIFICATION_OUTBOX_PUBLISHING_VISIBILITY_TIMEOUT:PT30S}
      scheduler:
        enabled: ${KACHI_NOTIFICATION_OUTBOX_SCHEDULER_ENABLED:true}
      retry:
        max-attempts: ${KACHI_NOTIFICATION_OUTBOX_RETRY_MAX_ATTEMPTS:3}
        base-delay: ${KACHI_NOTIFICATION_OUTBOX_RETRY_BASE_DELAY:PT1S}
        max-delay: ${KACHI_NOTIFICATION_OUTBOX_RETRY_MAX_DELAY:PT1M}
